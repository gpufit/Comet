[build-system]
requires    = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name              = "py-comet"
version           = "1.0.2"
description       = "Drift correction for single molecule localization microscopy datasets"
readme            = "README.md"
license = { text = "MIT" }
requires-python   = ">=3.6,<=3.14"
authors           = [
  { name = "Lenny Reinkensmeier", email = "lenny.reinkensmeier@ifnano.de" },
  { name = "Mark Bates", email = "mark.bates@ifnano.de" }
]
dependencies = [
  # ---- Python < 3.13 stack (stable) ----
  "numpy>=1.19,<2.0; python_version<'3.13'",
  "scipy>=1.5; python_version<'3.13'",
  "numba>=0.53; python_version<'3.13'",
  "pandas>=1.1.5; python_version<'3.13'",
  "scikit-learn>=0.24; python_version<'3.13'",
  "matplotlib>=3.1,<3.8; python_version<'3.13'",
  "h5py>=3.1; python_version<'3.13'",
  "lmfit>=1.0.3, <1.4; python_version<'3.13'",

  # ---- Python >= 3.13 stack  ----
  "numpy>=2.1; python_version>='3.13'",
  "scipy>=1.14.1; python_version>='3.13'",
  "numba>=0.61.0; python_version>='3.13'",
  "pandas>=2.2.3; python_version>='3.13'",
  "scikit-learn>=1.6; python_version>='3.13'",
  "matplotlib>=3.10; python_version>='3.13'",
  "h5py>=3.12; python_version>='3.13'",
  "lmfit>=1.3; python_version>='3.13'",
]

[project.optional-dependencies]
light = ["numba>=0.58.0,<=0.62.1"]

[project.urls]
Homepage    = "https://comet.smlm.tools/"
Repository  = "https://github.com/gpufit/Comet"

[tool.setuptools.packages.find]
where   = ["."]
include = ["comet*"]

[project.scripts]
comet = "comet.cli.cli_interface:main"
comet_self_test = "comet.tests.self_test:main"
