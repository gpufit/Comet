[build-system]
requires    = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name              = "py-comet"
version           = "1.0.2"
description       = "Drift correction for single molecule localization microscopy datasets"
readme            = "README.md"
license = { text = "MIT" }
requires-python   = ">=3.8,<=3.14"
authors           = [
  { name = "Lenny Reinkensmeier", email = "lenny.reinkensmeier@ifnano.de" },
  { name = "Mark Bates", email = "mark.bates@ifnano.de" }
]
dependencies = [
  # ---- Python < 3.13 stack (keeps your old constraint) ----
  "numpy>=1.20,<2.0; python_version<'3.13'",
  "scipy>=1.10; python_version<'3.13'",
  "numba>=0.58; python_version<'3.13'",
  "pandas>=2.0; python_version<'3.13'",
  "scikit-learn>=1.3; python_version<'3.13'",
  "matplotlib>=3.1,<3.8; python_version<'3.13'",
  "h5py>=3.11; python_version<'3.13'",
  "lmfit>=1.3; python_version<'3.13'",

  # ---- Python >= 3.13 stack (must move forward) ----
  "numpy>=2.1; python_version>='3.13'",          # Py3.13 support starts here  [oai_citation:8‡numpy.org](https://numpy.org/devdocs/release/2.1.0-notes.html?utm_source=chatgpt.com)
  "scipy>=1.14.1; python_version>='3.13'",       # Py3.13 wheels  [oai_citation:9‡SciPy Documentation](https://docs.scipy.org/doc/scipy/release/1.14.1-notes.html?utm_source=chatgpt.com)
  "numba>=0.61.0; python_version>='3.13'",       # Py3.13 + NumPy 2.1  [oai_citation:10‡numba.readthedocs.io](https://numba.readthedocs.io/en/stable/release/0.61.0-notes.html?utm_source=chatgpt.com)
  "pandas>=2.2.3; python_version>='3.13'",       # Py3.13 compatible  [oai_citation:11‡pandas.pydata.org](https://pandas.pydata.org/pandas-docs/stable/whatsnew/v2.2.3.html?utm_source=chatgpt.com)
  "scikit-learn>=1.6; python_version>='3.13'",   # Py3.13 supported  [oai_citation:12‡scikit-learn.org](https://scikit-learn.org/stable/install.html?utm_source=chatgpt.com)
  "matplotlib>=3.10; python_version>='3.13'",    # 3.13 wheel era  [oai_citation:13‡matplotlib.org](https://matplotlib.org/stable/users/prev_whats_new/github_stats_3.10.0.html?utm_source=chatgpt.com)
  "h5py>=3.12; python_version>='3.13'",          # “modern h5py” for 3.13  [oai_citation:14‡docs.h5py.org](https://docs.h5py.org/en/stable/whatsnew/3.13.html?utm_source=chatgpt.com)
  "lmfit>=1.3; python_version>='3.13'",
]



[project.optional-dependencies]
light = ["numba>=0.58.0,<=0.62.1"]

[project.urls]
Homepage    = "https://github.com/yourusername/comet-drift"
Repository  = "https://github.com/yourusername/comet-drift"

[tool.setuptools.packages.find]
where   = ["."]
include = ["comet*"]

[project.scripts]
comet = "comet.cli.cli_interface:main"
comet_self_test = "comet.tests.self_test:main"
